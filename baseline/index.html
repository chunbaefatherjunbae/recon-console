<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#020904">
  <title>RECON CONSOLE // BASELINE</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="icon" type="image/png" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../vendor/leaflet-1.9.4.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="theme-nvg-green">
  <main id="app" aria-label="RECON CONSOLE BASELINE">
    <div id="map" aria-label="지도">
      <div class="reticle" aria-hidden="true">
        <svg class="reticle-sight" viewBox="0 0 64 64" focusable="false" aria-hidden="true">
          <!-- C-2: four independent angle brackets; no ring or connected cross. -->
          <path class="reticle-brackets" d="M18 8H8V18 M46 8H56V18 M8 46V56H18 M56 46V56H46"/>
          <path class="reticle-ticks" d="M32 19V24 M32 40V45 M19 32H24 M40 32H45"/>
          <!-- The only aiming origin is the central 3-unit point (32,32). -->
          <rect class="reticle-point" x="30.5" y="30.5" width="3" height="3" rx=".4"/>
        </svg>
      </div>
    </div>
    <div class="map-tech-grid" aria-hidden="true"></div>

    <section class="position-hud" id="positionHud" aria-live="polite">
      <strong id="positionCoord">POS  --</strong>
      <strong class="reticle-coordinate" id="reticleCoord">RET  --</strong>
      <div class="position-status-row">
        <span id="positionMeta">NO REFERENCE</span>
        <span class="map-mode-status" id="mapModeStatus">MAP · ONLINE</span>
      </div>
    </section>

    <nav class="quick-stack" aria-label="지도 빠른 조작">
      <button class="quick-btn" id="searchBtn" type="button" aria-label="검색" title="검색">
        <span aria-hidden="true">⌕</span>
      </button>
      <button class="quick-btn" id="settingsBtn" type="button" aria-label="설정" title="설정">
        <span aria-hidden="true">⋮</span>
      </button>
      <button class="quick-btn layer-btn" id="layerBtn" type="button" aria-label="레이어" aria-pressed="false" title="레이어">
        <span class="layer-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3 3.5 8 12 13l8.5-5L12 3Z"/><path d="m5.5 12 6.5 3.8 6.5-3.8"/><path d="m5.5 16 6.5 3.8 6.5-3.8"/></svg>
        </span>
      </button>
      <button class="quick-btn" id="gpsBtn" type="button" aria-label="GPS 켜기/끄기" aria-pressed="false" title="GPS">
        <span class="btn-label">GPS</span>
      </button>
      <button class="quick-btn follow-btn" id="followBtn" type="button" aria-label="센터 및 트래킹" aria-pressed="false" title="센터 및 트래킹">
        <span id="followGlyph" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="1.5" class="follow-core"/></svg>
        </span>
      </button>
      <button class="quick-btn" id="tempBtn" type="button" aria-label="임시위치 갱신. 길게 누르면 기존 임시위치로 지도 이동" aria-pressed="false" title="TEMP">
        <span aria-hidden="true">◇</span>
      </button>
    </nav>

    <button class="nav-route-summary" id="navRouteSummary" type="button" hidden aria-label="항법 경로 수정">
      <span id="navRouteText">출발 → 목적지</span><b>⌄</b>
    </button>

    <section class="navigation-hud" id="navigationHud" hidden aria-live="polite" aria-label="계획 및 항법 계측 정보">
      <div class="nav-instrument-header">
        <small id="navModeLabel">PLAN / TARGET</small>
        <strong id="navTargetName">목적지</strong>
      </div>
      <div class="nav-instrument-main">
        <div class="nav-distance-readout">
          <small id="navDistanceLabel">직선 거리 · DIST</small>
          <div class="nav-distance-line">
            <strong id="navDistanceValue">--</strong><span id="navDistanceUnit">km</span>
          </div>
        </div>
        <div class="nav-angle-pair">
          <div class="nav-angle-readout">
            <small>도북 · GRID</small>
            <div class="nav-angle-line">
              <strong id="navGridBearing">--</strong>
              <svg viewBox="0 0 44 44" class="nav-bearing-gauge" role="img" aria-label="도북 방위각 계기">
                <circle cx="22" cy="22" r="16" class="nav-gauge-ring"/>
                <path d="M22 3v5 M22 36v5 M3 22h5 M36 22h5" class="nav-gauge-ticks"/>
                <path id="navGridNeedle" d="M22 8L27 26L22 22L17 26Z" class="nav-gauge-needle"/>
                <circle cx="22" cy="22" r="2" class="nav-gauge-center"/>
              </svg>
            </div>
          </div>
          <div class="nav-angle-readout">
            <small>자북 · MAG</small>
            <div class="nav-angle-line">
              <strong id="navMagBearing">--</strong>
              <svg viewBox="0 0 44 44" class="nav-bearing-gauge" role="img" aria-label="자북 방위각 계기">
                <circle cx="22" cy="22" r="16" class="nav-gauge-ring"/>
                <path d="M22 3v5 M22 36v5 M3 22h5 M36 22h5" class="nav-gauge-ticks"/>
                <path id="navMagNeedle" d="M22 8L27 26L22 22L17 26Z" class="nav-gauge-needle"/>
                <circle cx="22" cy="22" r="2" class="nav-gauge-center"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
      <div class="nav-instrument-secondary">
        <span id="navNowMetric">--</span>
        <span id="navStartMetric">--</span>
      </div>
      <div class="nav-instrument-footer">
        <span class="navigation-hud-sub" id="navDeclination">도자각 --</span>
        <span class="navigation-timer" id="navTimer" hidden>00:00:00</span>
      </div>
    </section>

    <div class="nav-session-controls" id="navSessionControls" hidden></div>

    <div class="drawing-controls" id="drawingControls" hidden aria-label="지도 드로잉">
      <div class="drawing-tool-row" role="group" aria-label="그리기 방식">
        <button type="button" data-draw-tool="FREE" class="active" aria-pressed="true">자유</button>
        <button type="button" data-draw-tool="POINT" aria-pressed="false">점 연결</button>
        <button type="button" data-draw-tool="ERASE" data-draw-kind="ERASE" aria-pressed="false">지우개</button>
      </div>
      <div class="drawing-action-row" role="group" aria-label="선 스타일 및 편집">
        <button type="button" data-draw-kind="MARK" class="active" aria-pressed="true">실선</button>
        <button type="button" data-draw-kind="ROUTE" aria-pressed="false">점선</button>
        <button type="button" id="drawFinishLineBtn" hidden>선 마침</button>
        <button type="button" id="drawUndoBtn">되돌리기</button>
        <button type="button" id="drawDoneBtn">완료</button>
      </div>
      <small class="drawing-mode-note" id="drawModeNote" role="status" aria-live="polite">손가락으로 자유롭게 그리기 · 두 손가락 확대·이동</small>
    </div>
    <div class="drawing-capture" id="drawingCapture" hidden aria-label="드로잉 영역"><span class="drawing-eraser-cursor" id="drawingEraserCursor" hidden aria-hidden="true"></span></div>

    <div class="scale-hud" id="scaleHud" aria-hidden="true">
      <span class="scale-line" id="scaleLine"></span>
      <strong id="scaleText">--</strong>
    </div>

    <section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
      <header class="sheet-head">
        <div>
          <small>BASELINE</small>
          <strong id="sheetTitle">패널</strong>
        </div>
        <button id="sheetClose" type="button" aria-label="닫기">×</button>
      </header>
      <div class="sheet-body" id="sheetBody"></div>
    </section>

    <nav class="bottom-nav" aria-label="주요 기능">
      <button type="button" data-panel="sites">거점</button>
      <button type="button" data-panel="explore">탐색</button>
      <button type="button" data-panel="plans">계획</button>
      <button type="button" data-panel="records">기록</button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="../vendor/leaflet-1.9.4.js"></script>
  <script src="../vendor/mgrs-1.0.0.js"></script>
  <script src="./state.js"></script>
  <script src="./data/sites.js"></script>
  <script src="./site-store.js"></script>
  <script src="./explore-core.js"></script>
  <script src="./navigation-core.js"></script>
  <script src="./plan-store.js"></script>
  <script src="./record-store.js"></script>
  <script src="./app.js"></script>
  <script src="./offline-runtime.js"></script>
  <script src="./lite-map.js"></script>
  <script src="./navigation-ui.js"></script>
</body>
</html>
